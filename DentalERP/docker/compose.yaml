services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dentalerp_test
    working_dir: /var/www
    command: php -d opcache.enable_cli=1 -d memory_limit=512M -S 0.0.0.0:8000 -t public
    volumes:
      - ..:/var/www:delegated
    ports:
      - "8080:8000"
    environment:
      - APP_ENV=staging
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - APP_DEBUG=false
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dentalerp_test

  postgres:
    image: postgres:17
    container_name: dentalerp_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dentalerp_test
    ports:
      - "5433:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - dentalerp_test

  redis:
    image: redis:7-alpine
    container_name: dentalerp_test_redis
    ports:
      - "6380:6379"
    networks:
      - dentalerp_test

  minio:
    image: minio/minio
    container_name: dentalerp_minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dentalerp_test

networks:
  dentalerp_test:
    driver: bridge

volumes:
  minio_data:
