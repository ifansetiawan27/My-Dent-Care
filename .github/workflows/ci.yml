name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DentalERP

jobs:
  test:
    name: Test (PHP 8.4, PostgreSQL 17)
    runs-on: ubuntu-latest

    # phpunit.xml pins DB_HOST/REDIS_HOST to the service names, so the job runs
    # inside a container on the same network where those names resolve.
    container:
      image: php:8.4-cli

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentalerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Install system packages and PHP extensions
        run: |
          apt-get update
          apt-get install -y git unzip libpq-dev libzip-dev
          docker-php-ext-install pdo_pgsql zip
          pecl install redis
          docker-php-ext-enable redis
        working-directory: /

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        working-directory: /

      - uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-container-${{ hashFiles('DentalERP/composer.lock') }}
          restore-keys: composer-container-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        run: php artisan test

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, zip, bcmath, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('DentalERP/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create .env for Larastan bootstrap
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            sed -i 's/^APP_KEY=$/APP_KEY=base64:0AUqeIwG3ZIkXiD+g4+wAGt1m6dS6C4D7xeP9nWcOpE=/' .env
            sed -i 's/^CACHE_STORE=redis/CACHE_STORE=array/' .env
            sed -i 's/^SESSION_DRIVER=redis/SESSION_DRIVER=array/' .env
            sed -i 's/^QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env
          fi

      - name: Run PHPStan
        run: |
          ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=raw 2>&1 | tee phpstan.log
          exit ${PIPESTATUS[0]}

      - name: Upload PHPStan log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-log
          path: DentalERP/phpstan.log

      - name: Show PHPStan log in annotations
        if: failure()
        run: |
          head -100 phpstan.log | while IFS= read -r line; do
            echo "::error file=phpstan.log,title=PHPSTAN::${line}"
          done

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, zip, bcmath, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
